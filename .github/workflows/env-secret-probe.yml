name: env-secret-probe
on:
  workflow_dispatch:
    inputs:
      envname: {description: env, required: true}
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ${{ inputs.envname }}
    steps:
      - name: is the environment secret visible here?
        env:
          S: ${{ secrets.ENVCANARY }}
        run: |
          if [ -n "$S" ]; then echo "RESULT: SECRET_PRESENT len=${#S}"; else echo "RESULT: SECRET_ABSENT"; fi
