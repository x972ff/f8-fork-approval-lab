name: oidc-sub-probe
on:
  workflow_dispatch:
    inputs:
      envname:
        description: environment to run in
        required: true
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ${{ inputs.envname }}
    steps:
      - name: show only the sub/aud claims (never the token)
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe-audience")
          JWT=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)[\"value\"])")
          PAYLOAD=$(echo "$JWT" | cut -d. -f2)
          python3 - "$PAYLOAD" <<PY
          import base64,json,sys
          p=sys.argv[1]; p+="="*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          print("SUB        :", c.get("sub"))
          print("AUD        :", c.get("aud"))
          print("REPOSITORY :", c.get("repository"))
          print("ENVIRONMENT:", c.get("environment"))
          print("REF        :", c.get("ref"))
          print("REPO_ID    :", c.get("repository_id"))
          PY
