name: oidc-sub-probe2
on:
  workflow_dispatch:
    inputs:
      envname: {description: env, required: false, default: ""}
permissions: {id-token: write, contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: ${{ inputs.envname }}
    steps:
      - run: |
          R=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe2")
          J=$(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin)[\"value\"])")
          P=$(echo "$J" | cut -d. -f2)
          python3 - "$P" <<PY
          import base64,json,sys
          p=sys.argv[1]; p+="="*(-len(p)%4)
          print("SUBJECT:", json.loads(base64.urlsafe_b64decode(p)).get("sub"))
          PY
