name: f8-probe
on: {workflow_dispatch: {inputs: {run_id: {required: true}, check_suite_id: {required: true}}}}
permissions:
  checks: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env: {GT: "${{ github.token }}", R: "${{ github.repository }}",
              RUN: "${{ inputs.run_id }}", CS: "${{ inputs.check_suite_id }}"}
        run: |
          H="Authorization: Bearer $GT"
          curl -s -o /dev/null -w 'approve   HTTP=%{http_code}\n' -X POST -H "$H" https://api.github.com/repos/$R/actions/runs/$RUN/approve
          curl -s -o /dev/null -w 'rerun     HTTP=%{http_code}\n' -X POST -H "$H" https://api.github.com/repos/$R/actions/runs/$RUN/rerun
          curl -s -o /dev/null -w 'rerequest HTTP=%{http_code}\n' -X POST -H "$H" https://api.github.com/repos/$R/check-suites/$CS/rerequest
